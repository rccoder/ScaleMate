name: Signed Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rccoder/ScaleMate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate before signing
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_i18n.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/scalemate-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ScaleMate.apk
      - name: Verify signature and package
        run: |
          python3 scripts/check_release.py --tag "${{ github.ref_name }}" \
            --apk dist/ScaleMate.apk --certificate-output dist/signing-certificate.txt
          cd dist
          sha256sum ScaleMate.apk > SHA256SUMS
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/ScaleMate.apk dist/SHA256SUMS dist/signing-certificate.txt \
            --verify-tag --title "称伴 · ScaleMate ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
