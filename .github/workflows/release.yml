name: Signed Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'rccoder/ScaleMate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'versionName = "([^"]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use a vX.Y.Z version tag'
          assert tag == 'v' + version, 'Tag must match versionName'
          PY
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Validate before signing
        run: |
          python3 scripts/check_i18n.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/scalemate-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew :app:assembleRelease --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ScaleMate.apk
      - name: Verify signature and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/ScaleMate.apk > dist/signing-certificate.txt
          expected_certificate=$(cat gradle/release-certificate.sha256)
          grep -Fq "Signer #1 certificate SHA-256 digest: $expected_certificate" dist/signing-certificate.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/ScaleMate.apk > "$RUNNER_TEMP/apk-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo 'Release must not be debuggable' >&2
            exit 1
          fi
          cd dist
          sha256sum ScaleMate.apk > SHA256SUMS
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          称伴 · ScaleMate，支持云麦智能体脂秤 3 SE（YMBS-M263） 与 Health Connect 体重同步。

          - Android 14 及以上；中文与英文界面。
          - 稳定体重确认、5 秒自动保存、本地记录与同步状态。
          - 本包为固定发布密钥签名的 release APK，后续同签名版本可覆盖升级。

          下载 **ScaleMate.apk**；SHA256SUMS 可用于核对文件完整性。
          当前为早期版本，称重时请保持 App 在前台。
          已安装旧 debug 版的用户不能直接覆盖安装此包，请先保留需要的记录再安排迁移；卸载旧版会删除它的本地记录。
          NOTES
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "$RELEASE_TAG" dist/ScaleMate.apk dist/SHA256SUMS dist/signing-certificate.txt \
            --verify-tag --title "称伴 · ScaleMate ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
